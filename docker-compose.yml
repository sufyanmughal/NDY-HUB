services:
  postgres:
    image: postgres:16-alpine
    container_name: ndy-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ndyhub
      POSTGRES_PASSWORD: ndyhub_dev_only
      POSTGRES_DB: ndyhub
    ports:
      - "5432:5432"
    volumes:
      - ndy_hub_postgres_data:/var/lib/postgresql/data

volumes:
  ndy_hub_postgres_data:
