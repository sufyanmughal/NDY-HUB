# Two entry points on one box, IP-only (no domain yet):
#   :80   -> web app  (what the client opens in a browser)
#   :3000 -> api       (matches NEXT_PUBLIC_API_URL / WEB_APP_URL in .env.prod)
# Both routes collide path-wise (web has /admin, /support, etc. mirroring
# the API's own top-level routes), so port-based separation is used instead
# of path-based. Once a real domain is pointed here, this becomes two
# server_name blocks on :443 with Let's Encrypt certs instead — same idea.

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 3000;
    server_name _;
    client_max_body_size 20m;

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
