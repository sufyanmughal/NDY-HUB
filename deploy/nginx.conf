# Real domains, HTTPS via Let's Encrypt certs (issued on the host with
# certbot --standalone, mounted read-only into this container — see
# deploy/README.md for the issuance/renewal commands). Port 80 stays open
# only to redirect to HTTPS; certbot's renewal hook briefly stops/starts
# this container around the standalone renewal (needs port 80 free).
#   ndyhub.com / www.ndyhub.com -> web app
#   api.ndyhub.com               -> api
# Same port-based-becomes-domain-based split the previous IP-only config's
# header comment already called out.

server {
    listen 80;
    server_name ndyhub.com www.ndyhub.com api.ndyhub.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ndyhub.com www.ndyhub.com;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/ndyhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ndyhub.com/privkey.pem;

    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.ndyhub.com;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/ndyhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ndyhub.com/privkey.pem;

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
