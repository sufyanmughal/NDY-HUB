# Production stack. Unlike the root docker-compose.yml (Postgres only, for
# local dev), this runs everything — api and web are pre-built images
# pushed to ghcr.io by .github/workflows/deploy.yml, pulled here rather than
# built on the box. Needs a .env.prod file alongside this one (see
# .env.prod.example) with real secrets and the ghcr.io image tags.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api npx prisma migrate deploy

services:
  postgres:
    image: postgres:16-alpine
    container_name: ndy-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ndyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ndyhub
    volumes:
      - ndy_hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndyhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE_API}
    container_name: ndy-hub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ndyhub:${POSTGRES_PASSWORD}@postgres:5432/ndyhub
      # schema.prisma's datasource requires directUrl (a Neon-era split
      # between pooled/direct connections) — a self-hosted single Postgres
      # container has no such split, so both point at the same instance.
      DIRECT_URL: postgresql://ndyhub:${POSTGRES_PASSWORD}@postgres:5432/ndyhub
      PORT: 3000
      WEB_APP_URL: ${WEB_APP_URL}
      API_URL: ${API_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CRYNDY_WEBHOOK_SECRET: ${CRYNDY_WEBHOOK_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      INTERNAL_ALERT_SECRET: ${INTERNAL_ALERT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OIDC_RSA_PRIVATE_KEY: ${OIDC_RSA_PRIVATE_KEY:-}
      OIDC_RSA_KEY_ID: ${OIDC_RSA_KEY_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - ndy_hub_api_uploads:/app/uploads
    expose:
      - "3000"

  web:
    image: ${IMAGE_WEB}
    container_name: ndy-hub-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # next.config.ts's rewrites() reads this at request time inside the
      # running container (not just at build time for the client bundle),
      # to proxy /api/* server-side to the real API origin. Without this,
      # it falls back to http://localhost:3000, which doesn't exist inside
      # this container (the API is the separate `api` service) — every
      # /api/* call 404s, breaking login entirely.
      NEXT_PUBLIC_API_URL: ${API_URL}
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    container_name: ndy-hub-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/static:/usr/share/nginx/static:ro

volumes:
  ndy_hub_postgres_data:
  ndy_hub_api_uploads:
